<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <section>
        <div>
            <div>
                <h2>Registration Form</h2>
                <form>
                    <label for="name">Name:</label>
                    <input type="text" placeholder="Enter your Name">
                    <br></br>
                    <label for="Email">Email:</label>
                    <input type="email" placeholder="Enter your email">
                    <br></br>
                  <label for="password">Passworrd:</label>
                    <input type="password" placeholder="Enter your password">
                    <br></br>
                    <label for="Age">Age:</label>
                    <input type="number" placeholder="Enter your age">
                    <br></br>
                    <label for="date of birth">Date of Birth:</label>
                    <input type="date">
                    <br></br>
                    <label for="gender">Gender</label>
                      <input type="radio" name="gender" value="male"><label>Male</label>
                        <input type="radio" name="gender" value="female"><label>Female</label>
                        <br></br>
                    <label for="course">Course:</label>
                    <select>
                    <option value="full stack development">Full stack development</option>
                     <option value="java">Java</option>
                     <option value="python">python</option>
                     <option value="DotNet full stack">DotNet Full Stack</option>
                </select>
                <br></br>
                <label for="skills">Skills:</label>
                  <input type="checkbox" name="Skills" value="Python"><label>Python</label>
                   <input type="checkbox" name="Skills" value="Java"><label>Java</label>
                     <input type="checkbox" name="Skills" value="JavaScript"><label>JavaScript</label>
                     <br></br>
                     <label for="studenet address">studenet address:</label>
                      <textarea rows="2" cols="40" placeholder=" Enter your Address">Address</textarea>
                      <br><br/>
                        <button type="reset">Reset</button>
                <button type="submit">Submit</button>
               </form>
                
            </div>
        </div>
    </section>
    
    
</body>
</html>
